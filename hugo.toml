baseURL = "/"
languageCode = "pt-br"
title = "Blog do João"
theme = "github-style"
summaryLength = 30

[params]
author = "João Pedro Della Guardia"
description = "Bioinformata."
github = "jpdellaguardia"
twitter = "jpguardia_"
linkedin = "joaopedrodellaguardia"
instagram = "jpguardia_"
email = "joaoemberlin@gmail.com"
url = "joaoemberlin.com"
keywords = "blog, bioinformática"
rss = true
lastmod = true
userStatusEmoji = "🧬"
favicon = "/images/github-mark.png"
avatar = "https://github.com/jpdellaguardia.png"
headerIcon = "/images/github-mark-white.png"
location = "Berlim, Alemanha"
enableGitalk = false
enableViewport = true

[permalinks]
post = "/post/:slug/"

[frontmatter]
lastmod = ["lastmod", ":fileModTime", ":default"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  # --- ESTA É A NOVA SEÇÃO NECESSÁRIA ---
  [markup.goldmark.parser.attribute]
    block = true
    title = true
