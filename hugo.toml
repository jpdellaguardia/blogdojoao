baseURL = "https://blogdojoao-nu.vercel.app/"
languageCode = "pt-br"
title = "Blog do João"
theme = "hugo-profile"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "RSS"]

enableRobotsTXT = true
paginate = 10

# Multilingual configuration
defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = false

[languages]
  [languages.pt]
    languageName = "Português"
    weight = 1
    contentDir = "content"
    languageCode = "pt-br"
  
  [languages.en]
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    languageCode = "en-us"

# Language-specific params (defined inline)
[languages.pt.params.hero]
  intro = "Olá, sou"
  title = "João Pedro Della Guardia"
  subtitle = "Bioinformática & Inteligência Artificial"
  content = "Compartilhando relatos e vivências em Berlim, projetos e ciência."

[languages.pt.params.about]
  title = "Sobre Mim"
  content = "Sou bioinformata e entusiasta de IA, atualmente vivendo em Berlim, Alemanha. Este blog é meu espaço para compartilhar aprendizados sobre ciência, tecnologia, e as curiosidades do dia a dia na Europa."

[languages.pt.params.experience]
  title = "Experiência"

[languages.pt.params.education]
  title = "Educação"

[languages.pt.params.projects]
  title = "Projetos"

[languages.pt.params.achievements]
  title = "Conquistas"

[languages.pt.params.contact]
  title = "Contato"

[languages.en.params.hero]
  intro = "Hi, I'm"
  title = "João Pedro Della Guardia"
  subtitle = "Bioinformatics & Artificial Intelligence"
  content = "Sharing experiences from Berlin, projects, and science."

[languages.en.params.about]
  title = "About Me"
  content = "I'm a bioinformatician and AI enthusiast, currently living in Berlin, Germany. This blog is my space to share learnings about science, technology, and curiosities from daily life in Europe."

[languages.en.params.experience]
  title = "Experience"

[languages.en.params.education]
  title = "Education"

[languages.en.params.projects]
  title = "Projects"

[languages.en.params.achievements]
  title = "Achievements"

[languages.en.params.contact]
  title = "Contact"

[params]
  title = "Blog do João"
  description = "Artigos sobre Berlim, tecnologia, ciência e curiosidades"
  favicon = "/images/github-mark.png"
  
  useBootstrapCDN = false
  animate = true

  [params.theme]
    defaultTheme = "auto"

  [params.font]
    fontSize = "1rem"
    fontWeight = 400
    lineHeight = 1.5

  [params.navbar]
    align = "ms-auto"
    brandName = "Blog do João"
    disableSearch = false
    [params.navbar.stickyNavBar]
      enable = true
      showOnScrollUp = true
    enableSeparator = false
    [params.navbar.menus]
      disableAbout = false
      disableExperience = false
      disableEducation = false
      disableProjects = false
      disableAchievements = false
      disableContact = false

  [params.hero]
    enable = true
    image = "/images/avatar.png"
    [params.hero.bottomImage]
      enable = false
    [params.hero.button]
      enable = true
      name = "Ver Posts"
      url = "/post/"
      download = false
      newPage = false
    [params.hero.socialLinks]
      [[params.hero.socialLinks.fontAwesomeIcons]]
        icon = "fab fa-github"
        url = "https://github.com/jpdellaguardia"
      [[params.hero.socialLinks.fontAwesomeIcons]]
        icon = "fab fa-linkedin"
        url = "https://linkedin.com/in/jpdellaguardia"

  [params.about]
    enable = true
    image = "/images/avatar.png"
    [params.about.skills]
      enable = true
      title = "Tecnologias e Interesses"
      items = ["Bioinformática", "Python", "Genômica", "Machine Learning", "Hugo", "Linux", "Git", "Docker"]

  [params.experience]
    enable = true
    [[params.experience.items]]
      company = "Freelance / Projetos Pessoais"
      companyUrl = "https://github.com/jpdellaguardia"
      [[params.experience.items.jobs]]
        name = "Bioinformata & Desenvolvedor"
        date = "2022 - Presente"
        content = "Desenvolvimento de pipelines de análise genômica, automação de fluxos de trabalho em bioinformática, e criação de ferramentas para análise de dados biológicos."
        [params.experience.items.jobs.info]
          content = "Bioinformática, Genômica, Python, Nextflow, Docker"
        [params.experience.items.jobs.featuredItems]
          [[params.experience.items.jobs.featuredItems.fontAwesomeIcons]]
            icon = "fab fa-github"
            url = "https://github.com/jpdellaguardia"
            tooltip = "Meus repositórios no GitHub"

  [params.education]
    enable = true
    index = true
    [[params.education.items]]
      title = "Mestrado em Bioinformática"
      school.name = "Universidade Federal do Rio de Janeiro (UFRJ)"
      school.url = "https://www.ufrj.br"
      date = "2020 - 2022"
      GPA = "9.5/10"
      content = "Foco em filogenia molecular, evolução genômica e análise de dados de sequenciamento de nova geração. Dissertação sobre evolução molecular em primatas."
      [params.education.items.featuredLink]
        enable = true
        name = "Dissertação"
        url = "https://github.com/jpdellaguardia"

    [[params.education.items]]
      title = "Bacharelado em Ciências Biológicas"
      school.name = "Universidade Federal do Rio de Janeiro (UFRJ)"
      school.url = "https://www.ufrj.br"
      date = "2015 - 2019"
      GPA = "8.7/10"
      content = "Formação sólida em biologia molecular, genética, bioquímica e estatística. Iniciação científica em filogenia molecular."

  [params.projects]
    enable = true
    [[params.projects.items]]
      title = "Blog do João"
      content = "Blog pessoal sobre bioinformática, ciência e vida em Berlim, construído com Hugo e tema hugo-profile."
      image = "/images/projects/blog.jpg"
      badges = ["Hugo", "Go", "CSS", "Vercel"]
      [params.projects.items.featured]
        name = "Visitar"
        link = "https://blogdojoao-nu.vercel.app/"
      [[params.projects.items.links]]
        icon = "fab fa-github"
        url = "https://github.com/jpdellaguardia/blogdojoao"

    [[params.projects.items]]
      title = "Pipeline de Análise Genômica"
      content = "Pipeline automatizado para análise de dados de sequenciamento (NGS) usando Nextflow e Docker."
      image = "/images/projects/pipeline.jpg"
      badges = ["Nextflow", "Docker", "Python", "Bioinformática"]
      [[params.projects.items.links]]
        icon = "fab fa-github"
        url = "https://github.com/jpdellaguardia"

    [[params.projects.items]]
      title = "Ferramentas de Filogenia"
      content = "Conjunto de scripts e ferramentas para análise filogenética molecular e evolutiva."
      image = "/images/projects/phylogeny.jpg"
      badges = ["Python", "R", "Bioinformática", "Filogenia"]
      [[params.projects.items.links]]
        icon = "fab fa-github"
        url = "https://github.com/jpdellaguardia"

  [params.achievements]
    enable = true
    [[params.achievements.items]]
      title = "Publicação Científica"
      content = "Artigo publicado em revista indexada sobre evolução molecular em primatas."
      url = "https://github.com/jpdellaguardia"
      image = "/images/achievements/publication.jpg"

    [[params.achievements.items]]
      title = "Projetos Open Source"
      content = "Contribuidor ativo em projetos de bioinformática no GitHub."
      url = "https://github.com/jpdellaguardia"
      image = "/images/achievements/opensource.jpg"

    [[params.achievements.items]]
      title = "Mestrado Concluído"
      content = "Mestrado em Bioinformática pela UFRJ com nota máxima."
      image = "/images/achievements/masters.jpg"

  [params.contact]
    enable = true
    content = "Tem alguma pergunta ou quer colaborar? Fique à vontade para entrar em contato!"
    btnName = "Enviar Email"
    btnLink = "mailto:joaoemberlin@gmail.com"

  [params.footer]
    [params.footer.recentPosts]
      path = "post"
      count = 5
      title = "Posts Recentes"
      enable = true
      disableFeaturedImage = false
    [params.footer.socialNetworks]
      github = "https://github.com/jpdellaguardia"
      linkedin = "https://linkedin.com/in/jpdellaguardia"
      email = "mailto:joaoemberlin@gmail.com"

  [params.listPages]
    disableFeaturedImage = false

  [params.singlePages]
    socialShare = true
    [params.singlePages.readTime]
      enable = true
      content = "min de leitura"
    [params.singlePages.scrollprogress]
      enable = true
    [params.singlePages.tags]
      openInNewTab = true

  [params.datesFormat]
    article = "2 de Jan, 2006"
    articleList = "2 de Jan, 2006"
    articleRecent = "2 de Jan, 2006"

  [params.terms]
    read = "Ler"
    toc = "Sumário"
    copyright = "Todos os direitos reservados"
    emailText = "Confira este site"

[menu]
  [[menu.main]]
    name = "Início"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Posts"
    url = "/post/"
    weight = 2

  [[menu.main]]
    name = "Projetos"
    url = "/#projects"
    weight = 3

  [[menu.main]]
    name = "Experiência"
    url = "/#experience"
    weight = 4

  [[menu.main]]
    name = "Educação"
    url = "/#education"
    weight = 5

  [[menu.main]]
    name = "Contato"
    url = "/#contact"
    weight = 6

  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 7

  [[menu.main]]
    name = "Categorias"
    url = "/categories/"
    weight = 8