# 1. Reescreve o arquivo hugo.toml
cat << 'EOF' > ~/projetos/blogdojoao/hugo.toml
baseURL = "https://blogdojoao-one.vercel.app/"
languageCode = "pt-br"
title = "Blog do João"
theme = "github-style"
relativeURLs = true
pygmentsCodeFences = true
pygmentsUseClasses = true

[params]
author = "João Pedro Della Guardia"
description = "Bioinformata."
github = "jpdellaguardia"
twitter = "jpguardia_"
linkedin = "joaopedrodellaguardia"
instagram = "jpguardia_"
email = "joaoemberlin@gmail.com"
url = "joaoemberlin.com"
keywords = "blog, bioinformática"
rss = true
lastmod = true
userStatusEmoji = "🧬"
favicon = "/images/github.png"
avatar = "https://github.com/jpdellaguardia.png"
headerIcon = "/images/GitHub-Mark-Light-32px.png"
location = "Berlim, Alemanha"
enableGitalk = false

[permalinks]
post = "/post/:slug/"

[frontmatter]
lastmod = ["lastmod", ":fileModTime", ":default"]

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
  unsafe = true
EOF

# 2. Sanitiza o arquivo removendo BOM e espaços não-quebráveis (\u00a0)
sed -i 's/\xc2\xa0/ /g' ~/projetos/blogdojoao/hugo.toml
sed -i '1s/^\xef\xbb\xbf//' ~/projetos/blogdojoao/hugo.toml